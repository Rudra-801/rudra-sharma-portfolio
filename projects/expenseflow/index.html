<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpenseFlow — Finance Analytics</title><style>
:root{--bg:#06100b;--panel:#0b1811;--line:#20372a;--text:#f4fff8;--muted:#86a191;--green:#4ee58d;--teal:#26c9b4;--red:#ff7c88;--gold:#ffd15c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 550px at 88% 0,#0d453066,transparent 70%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #1a3325;background:#06100bdc}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:950}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--teal));display:grid;place-items:center;color:#05110a;font-weight:1000}.top span{padding:7px 10px;border:1px solid #28513b;border-radius:999px;color:#88dfab;font-size:10px}.wrap{width:min(1180px,92vw);margin:30px auto}.hero{display:grid;grid-template-columns:1fr auto;gap:25px;align-items:end}.hero h1{font-size:34px;margin:0}.hero p{color:var(--muted)}.balance{text-align:right}.balance small{color:#739383}.balance b{display:block;font-size:42px;color:#7bf1aa}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.metric{padding:17px;border:1px solid var(--line);background:#0a1610;border-radius:15px}.metric b{display:block;font-size:24px;margin-top:5px}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{border:1px solid var(--line);background:#0a1610;border-radius:18px;padding:18px}.panel h2{margin-top:0}.panel input,.panel select{width:100%;padding:10px;background:#06100b;color:#fff;border:1px solid #284433;border-radius:9px;margin:6px 0 11px}.btn{width:100%;padding:11px;border:0;border-radius:10px;background:var(--green);color:#06130a;font-weight:950;cursor:pointer}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select{margin:0}.toolbar input{flex:1}.chart{display:flex;align-items:end;gap:12px;height:120px;padding:15px 8px 0;border-bottom:1px solid #1d3527;margin-bottom:15px}.bar{flex:1;max-width:60px;background:linear-gradient(180deg,var(--green),#1f8c58);border-radius:8px 8px 2px 2px;min-height:8px;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:#789485}.tx{display:grid;grid-template-columns:44px 1fr auto auto;gap:11px;align-items:center;padding:12px;border-bottom:1px solid #1c3326}.ico{width:40px;height:40px;border-radius:12px;background:#10251a;display:grid;place-items:center}.tx small{color:#779184}.income{color:#6deb9d}.expense{color:#ff8993}.tx button{border:0;background:none;color:#7d9788;cursor:pointer}.budget{height:9px;background:#12251a;border-radius:99px;overflow:hidden;margin-top:8px}.budget i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0}.empty{padding:30px;text-align:center;color:#789184}@media(max-width:800px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.balance{text-align:left}.toolbar{flex-direction:column}}
</style></head><body><header class="top"><div class="brand"><div class="mark">₹</div>Expense<span style="color:#4ee58d">Flow</span></div><span>● DATA PERSISTED LOCALLY</span></header><main class="wrap"><div class="hero"><div><small style="color:#56db93;font-weight:900">PERSONAL FINANCE DASHBOARD</small><h1>Know where the money goes.</h1><p>Transaction CRUD, category filters, aggregation and monthly budget indicators.</p></div><div class="balance"><small>CURRENT BALANCE</small><b id="balance">₹0</b></div></div><section class="metrics"><div class="metric"><small>Total Income</small><b class="income" id="income">₹0</b></div><div class="metric"><small>Total Expenses</small><b class="expense" id="expenses">₹0</b></div><div class="metric"><small>Budget Used</small><b id="budgetText">0%</b><div class="budget"><i id="budgetBar"></i></div></div></section><section class="layout"><article class="panel"><h2>Add transaction</h2><input id="title" placeholder="Transaction title"><input id="amount" type="number" placeholder="Amount"><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><select id="category"><option>Food</option><option>Travel</option><option>Salary</option><option>Education</option><option>Shopping</option><option>Other</option></select><input id="date" type="date"><button class="btn" id="save">Save transaction</button><p style="color:#708c7b;font-size:11px">Monthly expense budget: ₹20,000</p></article><article class="panel"><div class="toolbar"><input id="search" placeholder="Search transactions..."><select id="filter"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="chart" id="chart"></div><div id="list"></div></article></section></main><script>
const seed=[{id:1,title:'Freelance Payment',amount:12000,type:'income',category:'Salary',date:'2026-09-01'},{id:2,title:'Cloud Course',amount:1499,type:'expense',category:'Education',date:'2026-09-01'},{id:3,title:'Metro & Cab',amount:680,type:'expense',category:'Travel',date:'2026-09-02'},{id:4,title:'Keyboard Upgrade',amount:3499,type:'expense',category:'Shopping',date:'2026-09-02'},{id:5,title:'Cafe',amount:560,type:'expense',category:'Food',date:'2026-09-03'}];let tx=JSON.parse(localStorage.getItem('expenseflow-pro')||'null')||seed;const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');function persist(){localStorage.setItem('expenseflow-pro',JSON.stringify(tx))}function draw(){let inc=tx.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0),exp=tx.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0);balance.textContent=money(inc-exp);income.textContent=money(inc);expenses.textContent=money(exp);let pct=Math.min(100,Math.round(exp/20000*100));budgetText.textContent=pct+'%';budgetBar.style.width=pct+'%';let q=search.value.toLowerCase(),f=filter.value,arr=tx.filter(x=>(f==='all'||x.type===f)&&(`${x.title} ${x.category}`).toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(t=>`<div class="tx"><div class="ico">${t.type==='income'?'↗':'↘'}</div><div><b>${t.title}</b><br><small>${t.category} • ${t.date}</small></div><b class="${t.type}">${t.type==='income'?'+':'-'}${money(t.amount)}</b><button data-del="${t.id}">Delete</button></div>`).join(''):'<div class="empty">No matching transactions.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{tx=tx.filter(x=>x.id!=b.dataset.del);persist();draw()});let cats=['Food','Travel','Education','Shopping'];let vals=cats.map(c=>tx.filter(x=>x.type==='expense'&&x.category===c).reduce((a,b)=>a+b.amount,0)),max=Math.max(...vals,1);chart.innerHTML=cats.map((c,i)=>`<div class="bar" style="height:${Math.max(8,vals[i]/max*90)}px" title="${c}: ${money(vals[i])}"><span>${c.slice(0,4)}</span></div>`).join('')}save.onclick=()=>{if(!title.value.trim()||!+amount.value)return alert('Enter title and amount');tx.unshift({id:Date.now(),title:title.value.trim(),amount:+amount.value,type:type.value,category:category.value,date:date.value||new Date().toISOString().slice(0,10)});title.value=amount.value='';persist();draw()};search.oninput=filter.onchange=draw;date.value=new Date().toISOString().slice(0,10);draw();
</script><script>(function(){const storageKey='expenseflow-pro',apiKey='expenseflow';const original=localStorage.setItem.bind(localStorage);localStorage.setItem=function(k,v){original(k,v);if(k===storageKey)fetch('/api/state/'+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:JSON.parse(v)})}).catch(()=>{})};fetch('/api/state/'+apiKey).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.state&&!sessionStorage.getItem('api-hydrated-'+apiKey)){sessionStorage.setItem('api-hydrated-'+apiKey,'1');original(storageKey,JSON.stringify(d.state));location.reload()}}).catch(()=>{});})();</script></body></html>
