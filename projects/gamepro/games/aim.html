<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width'><title>Aim Lab Mini</title><style>body{margin:0;background:#05030c;color:#fff;font-family:system-ui;overflow:hidden}.top{padding:14px 24px}.arena{height:calc(100vh - 70px);position:relative;border-top:1px solid #302044;background:radial-gradient(circle at center,#160a25,#05030c)}.dot{position:absolute;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#ff3bd4 12% 40%,#7c3aed 42%);box-shadow:0 0 35px #f43bd6;cursor:crosshair}a{color:#ff61e4}</style></head><body><div class=top><a href='../games.html'>← Games</a>　<b>Aim Lab Mini 🎯</b>　<span id=s>Hits: 0</span></div><div class=arena id=a></div><script>let n=0;function spawn(){a.innerHTML='';let d=document.createElement('div');d.className='dot';d.style.left=Math.random()*(innerWidth-70)+'px';d.style.top=Math.random()*(innerHeight-150)+'px';d.onclick=()=>{s.textContent='Hits: '+(++n);spawn()};a.append(d)}spawn()</script></body></html>
