<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width'><title>Flappy Nova</title><style>body{margin:0;background:#07030e;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}canvas{border:1px solid #37234d;border-radius:20px;background:linear-gradient(#151044,#090615)}a{color:#ff5de2}</style></head><body><div><a href='../games.html'>← NEXARC Games</a><h1>Flappy Nova 🐦</h1><canvas id=c width=500 height=600></canvas><p>Space / click to flap</p></div><script>let x=90,y=280,v=0,score=0,pipes=[];let ctx=c.getContext('2d');function flap(){v=-7}addEventListener('keydown',e=>{if(e.code==='Space')flap()});c.onclick=flap;function loop(){v+=.38;y+=v;if(Math.random()<.012)pipes.push({x:500,g:120+Math.random()*280});pipes.forEach(p=>p.x-=3);pipes=pipes.filter(p=>p.x>-60);ctx.clearRect(0,0,500,600);ctx.fillStyle='#f43bd6';ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fill();ctx.fillStyle='#8b5cf6';pipes.forEach(p=>{ctx.fillRect(p.x,0,55,p.g-80);ctx.fillRect(p.x,p.g+80,55,600);if(x>p.x&&x<p.x+55&&(y<p.g-80||y>p.g+80)){y=280;v=0;pipes=[];score=0}});ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText('Score '+score,20,30);if(y>600||y<0){y=280;v=0;pipes=[]}requestAnimationFrame(loop)}loop()</script></body></html>
