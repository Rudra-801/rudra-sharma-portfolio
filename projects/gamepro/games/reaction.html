<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width'><title>Reaction Rush</title><style>body{margin:0;background:#07030e;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.b{width:min(700px,85vw);height:420px;border:1px solid #35214c;border-radius:24px;background:#11091d;display:grid;place-items:center;text-align:center;cursor:pointer}.go{background:#28104a;box-shadow:inset 0 0 100px #f43bd655}a{color:#ff61e4}</style></head><body><div><a href='../games.html'>← NEXARC Games</a><h1>Reaction Rush ⚡</h1><div class=b id=b><h2 id=t>Click to start</h2></div></div><script>let start,ready=false,timer;b.onclick=()=>{if(ready){t.textContent='⚡ '+(performance.now()-start).toFixed(0)+' ms — click to retry';b.classList.remove('go');ready=false}else{t.textContent='Wait for it…';clearTimeout(timer);timer=setTimeout(()=>{ready=true;start=performance.now();t.textContent='CLICK!';b.classList.add('go')},1000+Math.random()*3000)}}</script></body></html>
