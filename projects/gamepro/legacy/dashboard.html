<!DOCTYPE html>
<html><head><title>GamePro Dashboard</title><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="platform.css" rel="stylesheet"/><link href="gamepro-theme.css" rel="stylesheet"/><script defer="True" src="gamepro-theme.js"></script></head><body><nav class="nav"><a class="brand" href="home page.html">GAMEPRO</a><div class="navlinks"><a href="games.html">Games</a><a href="dashboard.html">Dashboard</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a><a href="#" onclick="GamePro.logout();return false">Logout</a></div></nav><main class="wrap"><div class="eyebrow">Player dashboard</div><h1 id="hello">Welcome back</h1><p class="muted">Play games, earn XP and build your activity history.</p><section class="grid"><div class="card">Level<div class="value" id="level">1</div><div class="progress"><span id="bar"></span></div></div><div class="card">Total XP<div class="value" id="xp">0</div></div><div class="card">Games Played<div class="value" id="played">0</div></div><div class="card">Quick Play<div style="margin-top:14px"><a class="btn" href="games.html">Browse Games</a></div></div></section><section class="card activity"><h2>Recent activity</h2><div id="activity"></div></section></main><script src="app.js"></script><script>if(GamePro.requireAuth()){const u=GamePro.user(),a=GamePro.activity();hello.textContent='Welcome back, '+u.first;level.textContent=u.level||1;xp.textContent=u.xp||0;played.textContent=a.length;bar.style.width=((u.xp||0)%100)+'%';activity.innerHTML=a.length?a.map(x=>`<div class="row"><b>${x.game}</b><span class="muted">${new Date(x.time).toLocaleString()}</span></div>`).join(''):'<div class="empty">No games played yet.</div>';}</script></body></html>
