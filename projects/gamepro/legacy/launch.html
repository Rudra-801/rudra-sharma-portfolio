<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>GamePro Play</title><link href="game-shell.css" rel="stylesheet"/><link href="gamepro-theme.css" rel="stylesheet"/><script defer="True" src="gamepro-theme.js"></script></head><body>
<div class="shell"><header class="topbar"><a class="brand" href="home page.html">GAME<span>PRO</span></a><a href="games.html">← Games</a><div class="game-title" id="barTitle">Game</div><button id="guide">? How to Play</button><button id="mute">🔊</button><label class="volume">Volume <input id="volume" max="100" min="0" type="range" value="70"/></label><a href="home page.html">⌂ Home</a></header><main class="stage"><iframe allow="autoplay" class="game-frame" id="frame"></iframe><section class="intro" id="intro"><div class="intro-card"><div class="eyebrow">GAMEPRO • QUICK GUIDE</div><h1 id="title">Game</h1><p id="desc"></p><div class="control-box" id="controls"></div><div class="actions"><button class="primary" id="play">Play Now →</button><button class="secondary" id="skip">Skip Intro</button><a class="secondary" href="games.html">Choose another game</a></div><p class="hint">Press ? How to Play anytime to reopen this guide.</p></div></section></main></div>
<script>
const games={ttt:{title:'Tic Tac Toe',src:'tictactoe.html',desc:'Play classic Tic Tac Toe locally or against the computer.',controls:[['Mouse / Touch','Choose a square'],['Mode','Player vs Player / Computer'],['Goal','Make three in a row']]},snake:{title:'Snake',src:'game1 .html',desc:'Eat food, grow longer and survive. Avoid the walls and your own body.',controls:[['↑ ↓ ← → / WASD','Move snake'],['Food','+1 score'],['Goal','Beat your high score']]},maze:{title:'Maze Runner',src:'game3 .html',desc:'Take the key through the maze to the house. Choose a difficulty, press Start and navigate carefully.',controls:[['↑ ↓ ← → / WASD','Move the key'],['Start','Generate maze'],['Difficulty','Easy → Extreme']]},memory:{title:'Memory Match',src:'game4 .html',desc:'Flip cards, remember their positions and match every pair in the fewest moves.',controls:[['Mouse / Touch','Flip cards'],['Match','Find identical pairs'],['Goal','Lowest moves & time']]},tower:{title:'Tower Blocks',src:'06-Tower-Blocks/index.html',desc:'Stack moving blocks accurately. Missed edges are cut away, making each next placement harder.',controls:[['Spacebar','Place block'],['Mouse / Touch','Click to place'],['Goal','Build the tallest tower']]},hangman:{title:'Hangman',src:'18-Hangman-Game/index.html',desc:'Guess the hidden word before the drawing is completed.',controls:[['A – Z','Guess a letter'],['Keyboard','Type letters'],['Goal','Solve before your misses run out']]},crossy:{title:'Crossy Road',src:'20-Crossy-Road-Game/index.html',desc:'Cross busy roads, avoid vehicles and move forward as far as possible.',controls:[['↑ / W','Forward'],['← → / A D','Sideways'],['↓ / S','Backward']]},fruit:{title:'Fruit Slicer',src:'26-Fruit-Slicer-Game/index.html',desc:'Slice fruit before it drops and build the highest score you can.',controls:[['Mouse / Touch','Slice fruit'],['Avoid misses','Protect lives'],['Goal','Highest score']]} };
const q=new URLSearchParams(location.search),key=q.get('game')||'snake',g=games[key]||games.snake;document.getElementById('title').textContent=g.title;document.getElementById('barTitle').textContent=g.title;document.getElementById('desc').textContent=g.desc;document.getElementById('controls').innerHTML=g.controls.map(x=>`<div class="control"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');document.title=`${g.title} • GamePro`;const frame=document.getElementById('frame');frame.src=g.src;const intro=document.getElementById('intro');
function closeIntro(){intro.classList.add('hidden');setTimeout(()=>frame.contentWindow?.focus(),80)}document.getElementById('play').onclick=closeIntro;document.getElementById('skip').onclick=closeIntro;document.getElementById('guide').onclick=()=>intro.classList.remove('hidden');
let muted=localStorage.getItem('gpMuted')==='1';const vol=document.getElementById('volume'),mute=document.getElementById('mute');vol.value=String(Math.round((parseFloat(localStorage.getItem('gpVolume')||'.7'))*100));function syncAudio(){const v=Number(vol.value)/100;localStorage.setItem('gpMuted',muted?'1':'0');localStorage.setItem('gpVolume',String(v));mute.textContent=muted?'🔇':'🔊';try{frame.contentDocument?.querySelectorAll('audio,video').forEach(a=>{a.muted=muted;a.volume=v});frame.contentWindow?.postMessage({type:'gamepro-audio',muted,volume:v},'*')}catch(e){}}mute.onclick=()=>{muted=!muted;syncAudio()};vol.oninput=syncAudio;frame.onload=()=>{syncAudio();frame.contentWindow?.focus()};setInterval(syncAudio,500);syncAudio();
window.addEventListener('keydown',e=>{if(!intro.classList.contains('hidden'))return;const map={ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',w:'w',W:'w',a:'a',A:'a',s:'s',S:'s',d:'d',D:'d',' ':' '};if(map[e.key]!==undefined){e.preventDefault();try{frame.contentWindow.focus();frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:map[e.key],code:e.code,keyCode:e.keyCode,which:e.which,bubbles:true}))}catch(_){}}});
</script></body></html>
