<!DOCTYPE html>
<html><head><title>GamePro Leaderboard</title><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="platform.css" rel="stylesheet"/><link href="gamepro-theme.css" rel="stylesheet"/><script defer="True" src="gamepro-theme.js"></script></head><body><nav class="nav"><a class="brand" href="home page.html">GAMEPRO</a><div class="navlinks"><a href="games.html">Games</a><a href="dashboard.html">Dashboard</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a><a href="#" onclick="GamePro.logout();return false">Logout</a></div></nav><main class="wrap"><div class="eyebrow">Competition</div><h1>Leaderboard</h1><p class="muted">Ranked by XP earned from launching games while signed in.</p><section class="card"><div id="board"></div></section></main><script src="app.js"></script><script>if(GamePro.requireAuth()){let us=JSON.parse(localStorage.getItem('gamepro_users')||'[]').sort((a,b)=>(b.xp||0)-(a.xp||0));board.innerHTML=us.length?us.map((u,i)=>`<div class="row"><b>#${i+1} &nbsp; ${u.first} ${u.last}</b><span>${u.xp||0} XP · Level ${u.level||1}</span></div>`).join(''):'<div class="empty">No players yet.</div>';}</script></body></html>
