<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GamePro Login</title>
<link href="login page2 .css" rel="stylesheet"/>
<link href="gamepro-theme.css" rel="stylesheet"/><script defer="True" src="gamepro-theme.js"></script></head>
<body>
<div class="login-container">
<div class="image-section">
<img alt="Gaming Controller" src="background imge.jpg"/>
<h3>Gaming Platform</h3>
</div>
<div class="form-section">
<h2>Login</h2>
<div class="input-group">
<label for="email">Email</label>
<input id="email" placeholder="Enter your email" type="email"/>
</div>
<div class="input-group">
<label for="password">Password</label>
<input id="password" placeholder="Enter your password" type="password"/>
</div>
<button class="login-btn" id="loginButton">Login</button>
<p class="error-message" id="error-message">Please enter a valid email and password.</p>
<p style="margin-top:18px">New to GamePro? <a href="login_page.html" style="color:#ff4ded">Create account</a></p>
</div>
</div>
<script src="login page2 .js"></script>
</body>
</html>
