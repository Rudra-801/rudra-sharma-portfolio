<!DOCTYPE html>
<html><head><title>GamePro Profile</title><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="platform.css" rel="stylesheet"/><link href="gamepro-theme.css" rel="stylesheet"/><script defer="True" src="gamepro-theme.js"></script></head><body><nav class="nav"><a class="brand" href="home page.html">GAMEPRO</a><div class="navlinks"><a href="games.html">Games</a><a href="dashboard.html">Dashboard</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a><a href="#" onclick="GamePro.logout();return false">Logout</a></div></nav><main class="wrap"><div class="eyebrow">Player profile</div><h1 id="name">Profile</h1><section class="grid"><div class="card">Email<div class="value" id="email" style="font-size:18px"></div></div><div class="card">Level<div class="value" id="level"></div></div><div class="card">XP<div class="value" id="xp"></div></div><div class="card">Member Since<div class="value" id="joined" style="font-size:18px"></div></div></section><p style="margin-top:28px"><a class="btn" href="games.html">Play a game</a></p></main><script src="app.js"></script><script>if(GamePro.requireAuth()){const u=GamePro.user();name.textContent=u.first+' '+u.last;email.textContent=u.email;level.textContent=u.level||1;xp.textContent=u.xp||0;joined.textContent=new Date(u.joined).toLocaleDateString();}</script></body></html>
