<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Tic Tac Toe • GamePro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#082f43,transparent 28%),radial-gradient(circle at 90% 0,#28175a,transparent 30%),#060914;color:#f7f9ff;font-family:Inter,system-ui,sans-serif}.top{height:68px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid #1e2b49;background:#070b17}.brand{font-weight:950;font-size:21px;margin-right:auto}.brand b{color:#36d8ff}.top a,.top button{color:#eaf0ff;text-decoration:none;background:#0e162a;border:1px solid #29385c;border-radius:10px;padding:10px 13px;font-weight:750}.wrap{width:min(920px,94%);margin:34px auto}.head{text-align:center}.ey{color:#36d8ff;font-size:12px;letter-spacing:2px;font-weight:900}.head h1{font-size:42px;margin:8px}.head p{color:#9eadd0}.modes,.difficulty{display:flex;justify-content:center;gap:10px;margin:18px 0}.choice{border:1px solid #31416b;background:#0e162b;color:#dfe7ff;padding:11px 16px;border-radius:11px;cursor:pointer;font-weight:800}.choice.active{background:linear-gradient(135deg,#7358ff,#a95cff);border-color:transparent}.game{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}.panel{background:#0c1326;border:1px solid #253557;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0007}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:500px;margin:auto}.cell{aspect-ratio:1;border:1px solid #344a79;background:linear-gradient(145deg,#101a32,#0a1122);border-radius:16px;color:white;font-size:clamp(44px,7vw,72px);font-weight:950;cursor:pointer}.cell.x{color:#37d9ff}.cell.o{color:#b26cff}.status{text-align:center;margin:18px 0 4px;font-weight:850;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:14px;background:#091020;border:1px solid #223151;border-radius:13px;text-align:center}.stat b{display:block;font-size:24px;margin-top:5px}.restart{width:100%;margin-top:16px;padding:12px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#7358ff,#a95cff);font-weight:850;cursor:pointer}.note{color:#8f9fc5;font-size:13px;line-height:1.6;margin-top:16px}@media(max-width:760px){.game{grid-template-columns:1fr}.top .hide{display:none}}
</style><link href="game-embed.css" rel="stylesheet"/></head><body><main class="wrap"><section class="head"><div class="ey">STRATEGY • TIC TAC TOE</div><h1>Choose how you want to play</h1><p>Play locally with a friend or challenge the computer.</p></section><div class="modes"><button class="choice active" data-mode="pvp">👥 Player vs Player</button><button class="choice" data-mode="cpu">🤖 Player vs Computer</button></div><div class="difficulty" hidden="" id="difficulty"><button class="choice" data-diff="easy">Easy</button><button class="choice active" data-diff="smart">Smart</button></div><section class="game"><div class="panel"><div class="board" id="board"></div><div class="status" id="status">X's turn</div></div><aside class="panel"><div class="stats"><div class="stat">X<b id="sx">0</b></div><div class="stat">Draw<b id="sd">0</b></div><div class="stat">O<b id="so">0</b></div></div><button class="restart" id="restart">Restart round</button><button class="restart" id="reset" style="background:#121b31;border:1px solid #31416b">Reset score</button><p class="note" id="note">Local mode: X and O take turns on the same device.</p></aside></section></main><script>
const board=document.getElementById('board'),statusEl=document.getElementById('status'),diffEl=document.getElementById('difficulty'),note=document.getElementById('note');let cells=Array(9).fill(''),turn='X',over=false,mode='pvp',diff='smart',scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+v.toLowerCase();b.textContent=v;b.onclick=()=>move(i);board.appendChild(b)});sx.textContent=scores.X;so.textContent=scores.O;sd.textContent=scores.D}function result(){for(const w of wins){if(cells[w[0]]&&cells[w[0]]===cells[w[1]]&&cells[w[1]]===cells[w[2]])return cells[w[0]]}return cells.every(Boolean)?'D':null}function finish(r){over=true;if(r==='D'){scores.D++;statusEl.textContent='Draw — close round!'}else{scores[r]++;statusEl.textContent=(mode==='cpu'&&r==='O'?'Computer':r)+' wins!'}render()}function move(i){if(over||cells[i]||(mode==='cpu'&&turn==='O'))return;cells[i]=turn;let r=result();if(r)return finish(r);turn=turn==='X'?'O':'X';statusEl.textContent=mode==='cpu'&&turn==='O'?'Computer is thinking…':turn+"'s turn";render();if(mode==='cpu'&&turn==='O')setTimeout(cpuMove,350)}function cpuMove(){if(over)return;let open=cells.map((v,i)=>v?null:i).filter(v=>v!==null),pick;if(diff==='smart'){pick=findWin('O')??findWin('X')??(cells[4]===''?4:null)??open[Math.floor(Math.random()*open.length)]}else pick=open[Math.floor(Math.random()*open.length)];cells[pick]='O';let r=result();if(r)return finish(r);turn='X';statusEl.textContent="Your turn — X";render()}function findWin(mark){for(const i of cells.map((v,i)=>v===''?i:null).filter(v=>v!==null)){cells[i]=mark;const r=result();cells[i]='';if(r===mark)return i}return null}function restart(){cells=Array(9).fill('');turn='X';over=false;statusEl.textContent=mode==='cpu'?"Your turn — X":"X's turn";render()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;diffEl.hidden=mode!=='cpu';note.textContent=mode==='cpu'?'You are X. The computer plays O automatically. Choose Easy or Smart.':'Local mode: X and O take turns on the same device.';restart()});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-diff]').forEach(x=>x.classList.remove('active'));b.classList.add('active');diff=b.dataset.diff;restart()});restart.onclick=restart;reset.onclick=()=>{scores={X:0,O:0,D:0};restart()};render();
</script></body></html>
