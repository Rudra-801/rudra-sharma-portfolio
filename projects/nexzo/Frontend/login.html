<body class="login-page" data-page="login">
  <main class="auth">
    <section class="auth-brand-panel" aria-label="NEXZO personalized learning">
      <div class="brand">
        <img src="favicon.png" class="logo-img" alt="NEXZO">
        <div><h1>NEXZO</h1><p>Personalized Recommendations for University Students</p></div>
      </div>
      <p class="auth-brand-tagline">Learn · Plan · Grow · Beyond</p>
    </section>
    <form class="auth-box" novalidate>
      <h1>Login</h1>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Email address">

      <div style="position:relative">
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Password" style="padding-right:92px">
        <button type="button" class="btn" data-action="toggle-password" style="position:absolute;right:7px;top:14px;padding:9px 15px">Show</button>
      </div>

      <div style="text-align:right;margin:-4px 0 15px">
        <a href="#" data-action="forgot-password" style="color:var(--gold);font-weight:800">Forgot password?</a>
      </div>

      <button id="signInButton" class="btn primary" style="width:100%;justify-content:center">Sign In</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite" style="min-height:22px;text-align:center;margin:12px 0"></p>

      <p style="text-align:center;color:var(--muted);margin:8px 0 12px">OR</p>

      <button type="button" data-provider="google"  class="btn" style="width:100%;justify-content:center;margin-bottom:12px">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="22" height="22">
        Continue with Google
      </button>

      <button type="button" data-provider="github"  class="btn" style="width:100%;justify-content:center;margin-bottom:12px">
        <img src="https://github.githubassets.com/favicons/favicon.svg" alt="" width="22" height="22">
        Continue with GitHub
      </button>

      <button type="button" data-action="guest-login" class="btn primary" style="width:100%;justify-content:center">Continue as Guest</button>
      <p style="text-align:center">New here? <a href="signup.html" style="color:var(--gold);font-weight:800">Create account</a></p>
    </form>
  </main>
