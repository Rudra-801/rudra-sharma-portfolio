<body class="signup-page" data-page="signup">
  <main class="auth">
    <section class="auth-brand-panel" aria-label="NEXZO personalized learning">
      <div class="brand">
        <img src="favicon.png" class="logo-img" alt="NEXZO">
        <div><h1>NEXZO</h1><p>Personalized Recommendations for University Students</p></div>
      </div>
      <p class="auth-brand-tagline">Learn · Plan · Grow · Beyond</p>
    </section>
    <form class="auth-box" novalidate>
      <div class="brand">
        <img src="favicon.png" class="logo-img" alt="NEXZO">
        <div>
          <h1>NEXZO</h1>
          <p>PLAN &bull; LEARN &bull; ACHIEVE</p>
        </div>
      </div>

      <h1>Create Account</h1>
      <input id="name" autocomplete="name" required placeholder="Full name">
      <div class="nx-username-field"><span class="nx-at">@</span><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="20" pattern="[A-Za-z0-9._]{3,20}" required placeholder="username"><small>Your unique NEXZO tag · 3–20 letters, numbers, . or _</small></div>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Email address">

      <div style="position:relative">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Password" style="padding-right:92px">
        <button type="button" class="btn" data-action="toggle-password" style="position:absolute;right:7px;top:14px;padding:9px 15px">Show</button>
      </div>

      <label class="nx-legal-agree"><input id="legalAgreement" type="checkbox" required><span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and acknowledge the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>

      <button id="createAccountButton" class="btn primary" style="width:100%;justify-content:center">Create Account</button>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite" style="min-height:22px;text-align:center;margin:12px 0"></p>
      <p style="text-align:center">Already have an account? <a href="login.html" style="color:var(--gold);font-weight:800">Login</a></p>
    </form>
  </main>
