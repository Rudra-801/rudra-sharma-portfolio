<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizOps — Assessment Engine</title><style>
:root{--bg:#07100d;--panel:#0d1713;--line:#22362d;--text:#f3fff8;--muted:#8da89a;--green:#4fe49a;--blue:#58a8ff;--gold:#ffd15b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 550px at 90% 0,#0b3b2b55,transparent 70%),#060b09;color:var(--text);font:14px/1.5 Inter,system-ui}.top{height:72px;border-bottom:1px solid #1e3429;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:#07100dcc;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:950}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;color:#07120c;font-weight:1000}.status{display:flex;gap:10px}.status span{padding:7px 10px;border-radius:999px;background:#0c1913;border:1px solid #244334;color:#98dcb9;font-size:10px}.wrap{width:min(1100px,92vw);margin:34px auto}.dash{display:grid;grid-template-columns:1fr 280px;gap:20px}.hero{padding:26px;border:1px solid var(--line);background:linear-gradient(145deg,#0d1713,#0a1210);border-radius:20px}.heroTop{display:flex;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;color:#65ddb1;font-weight:900;letter-spacing:.13em}.hero h1{font-size:32px;margin:8px 0}.timer{font-size:30px;color:var(--gold);font-weight:1000}.progress{height:8px;background:#14221c;border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0;transition:.3s}.question{font-size:24px;line-height:1.3;margin:23px 0}.opts{display:grid;gap:10px}.opt{padding:14px 15px;border-radius:12px;border:1px solid #274236;background:#0a1410;color:#e9fff3;text-align:left;cursor:pointer;transition:.2s}.opt:hover{border-color:#4a7f67}.opt.sel{border-color:#5ce4a1;background:#103223}.row{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:1px solid #2b4438;background:#111f19;color:#fff;padding:10px 14px;border-radius:10px;font-weight:850;cursor:pointer}.btn.primary{background:var(--green);color:#06130c;border-color:var(--green)}.side{display:grid;gap:14px}.card{padding:18px;border:1px solid var(--line);background:#0c1512;border-radius:17px}.metric{font-size:28px;font-weight:1000;color:#8ff0bd}.qnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.qnav button{height:38px;border-radius:9px;border:1px solid #284136;background:#0b1611;color:#a8c2b4;cursor:pointer}.qnav button.active{background:#4fe49a;color:#07120c}.qnav button.done{border-color:#5b997c}.history{margin-top:20px}.attempt{display:flex;justify-content:space-between;border-top:1px solid #20342b;padding:10px 0}.admin{margin-top:20px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#0b1411}.adminGrid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}.admin input{background:#07100d;border:1px solid #2c4439;color:#fff;border-radius:9px;padding:10px}.result{display:none;padding:22px;border-radius:18px;background:#0d2118;border:1px solid #2d664a;margin-top:20px}.result.show{display:block}@media(max-width:800px){.dash{grid-template-columns:1fr}.adminGrid{grid-template-columns:1fr}.question{font-size:20px}}
</style></head><body><header class="top"><div class="brand"><div class="mark">Q</div>Quiz<span style="color:#4fe49a">Ops</span></div><div class="status"><span>● SERVER-CONTROLLED TIMER DEMO</span><span>MySQL schema included</span></div></header><main class="wrap"><section class="dash"><div><article class="hero"><div class="heroTop"><div><div class="eyebrow">FULL-STACK ASSESSMENT ENGINE</div><h1>Backend Engineering Quiz</h1></div><div class="timer" id="timer">01:00</div></div><div class="progress"><i id="bar"></i></div><small id="qLabel">Question 1 of 5</small><div class="question" id="question"></div><div class="opts" id="opts"></div><div class="row"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button></div></article><div class="result" id="result"></div></div><aside class="side"><article class="card"><small style="color:#7e9c8c">BEST SCORE</small><div class="metric" id="best">0%</div><p style="color:#789688">Stored locally for repeat viva demos.</p></article><article class="card"><b>Question navigator</b><div class="qnav" id="qnav" style="margin-top:13px"></div></article><article class="card"><b>Recent attempts</b><div class="history" id="history"></div></article></aside></section><section class="admin"><div class="eyebrow">ADMIN QUESTION MANAGER</div><h2 style="margin:8px 0">Add a custom question</h2><div class="adminGrid"><input id="newQ" placeholder="Question"><input id="newA" placeholder="Correct answer"><input id="newB" placeholder="Wrong answer"><button class="btn primary" id="addQ">Add</button></div><p id="adminMsg" style="color:#8bac9a"></p></section></main><script>
const defaults=[{q:'Which HTTP method is typically idempotent for full updates?',o:['POST','PUT','PATCH','CONNECT'],a:1},{q:'Which SQL normal form removes partial dependency on a composite key?',o:['1NF','2NF','3NF','BCNF'],a:1},{q:'What should controllers primarily do in layered architecture?',o:['Render CSS','Coordinate request/response flow','Store database files','Compile JavaScript'],a:1},{q:'Which status code best represents successful resource creation?',o:['200','201','204','304'],a:1},{q:'What is the main role of input validation?',o:['Increase font size','Reject invalid/untrusted data at boundaries','Replace database indexes','Create sessions'],a:1}];let custom=JSON.parse(localStorage.getItem('quizops-custom')||'[]'),questions=[...defaults,...custom];let i=0,answers={},left=60,tick=null;let attempts=JSON.parse(localStorage.getItem('quizops-attempts')||'[]');function render(){qLabel.textContent=`Question ${i+1} of ${questions.length}`;question.textContent=questions[i].q;opts.innerHTML=questions[i].o.map((x,j)=>`<button class="opt ${answers[i]===j?'sel':''}" data-o="${j}">${x}</button>`).join('');opts.querySelectorAll('button').forEach(b=>b.onclick=()=>{answers[i]=+b.dataset.o;render()});bar.style.width=((i+1)/questions.length*100)+'%';prev.disabled=i===0;next.textContent=i===questions.length-1?'Submit Quiz ✓':'Next →';qnav.innerHTML=questions.map((_,n)=>`<button data-i="${n}" class="${n===i?'active':''} ${answers[n]!==undefined?'done':''}">${n+1}</button>`).join('');qnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;render()});renderHistory()}function submit(){clearInterval(tick);let score=questions.reduce((s,q,n)=>s+(answers[n]===q.a),0),pct=Math.round(score/questions.length*100);attempts.unshift({pct,score,total:questions.length,at:new Date().toLocaleString()});attempts=attempts.slice(0,5);localStorage.setItem('quizops-attempts',JSON.stringify(attempts));let bestPct=Math.max(...attempts.map(x=>x.pct),0);localStorage.setItem('quizops-best',bestPct);best.textContent=bestPct+'%';result.classList.add('show');result.innerHTML=`<div class="eyebrow">RESULT PERSISTED</div><h2>${score}/${questions.length} correct · ${pct}%</h2><p>${pct>=80?'Strong result. The attempt is stored locally.':'Attempt saved. Review the architecture concepts and try again.'}</p><button class="btn primary" id="retry">Retry quiz</button>`;document.querySelector('#retry').onclick=()=>location.reload();renderHistory()}function renderHistory(){best.textContent=(localStorage.getItem('quizops-best')||'0')+'%';history.innerHTML=attempts.length?attempts.map(a=>`<div class="attempt"><span>${a.at}</span><b>${a.pct}%</b></div>`).join(''):'<p style="color:#759181">No attempts yet.</p>'}next.onclick=()=>{if(i===questions.length-1)submit();else{i++;render()}};prev.onclick=()=>{if(i>0){i--;render()}};addQ.onclick=()=>{if(!newQ.value.trim()||!newA.value.trim()||!newB.value.trim())return adminMsg.textContent='Fill all fields.';let q={q:newQ.value.trim(),o:[newB.value.trim(),newA.value.trim(),'None of the above','Depends on implementation'],a:1};custom.push(q);localStorage.setItem('quizops-custom',JSON.stringify(custom));questions=[...defaults,...custom];newQ.value=newA.value=newB.value='';adminMsg.textContent='Question added and persisted for this browser.';render()};tick=setInterval(()=>{left--;timer.textContent=`00:${String(left).padStart(2,'0')}`;if(left<=0)submit()},1000);render();
</script><script>(function(){const storageKey='quizops-pro',apiKey='quizops';const original=localStorage.setItem.bind(localStorage);localStorage.setItem=function(k,v){original(k,v);if(k===storageKey)fetch('/api/state/'+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:JSON.parse(v)})}).catch(()=>{})};fetch('/api/state/'+apiKey).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.state&&!sessionStorage.getItem('api-hydrated-'+apiKey)){sessionStorage.setItem('api-hydrated-'+apiKey,'1');original(storageKey,JSON.stringify(d.state));location.reload()}}).catch(()=>{});})();</script></body></html>
