<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentHub — Academic Records</title><style>
:root{--bg:#080915;--panel:#101221;--line:#292c42;--text:#f7f7ff;--muted:#9295ae;--purple:#9a6cff;--blue:#66a4ff;--green:#50df9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(850px 600px at 90% 0,#2e1b5e55,transparent 70%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui}.top{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 4vw;border-bottom:1px solid #22263a;background:#090a14d8}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:19px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-size:22px}.top button{border:1px solid #34384e;background:#141728;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.wrap{width:min(1220px,92vw);margin:30px auto}.head{display:flex;justify-content:space-between;align-items:end}.head h1{font-size:34px;margin:0}.head p{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric{padding:17px;border:1px solid var(--line);background:#0e1120;border-radius:15px}.metric small{color:#7f839b}.metric b{display:block;font-size:26px;margin-top:3px}.panel{border:1px solid var(--line);background:#0e1020;border-radius:18px;padding:18px}.tools{display:grid;grid-template-columns:1fr 190px auto auto;gap:9px}.tools input,.tools select{background:#0a0c17;color:#fff;border:1px solid #30344a;border-radius:10px;padding:10px}.btn{border:1px solid #3a3e56;background:#16192b;color:#fff;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.btn.primary{background:var(--purple);border-color:var(--purple)}table{width:100%;border-collapse:collapse;margin-top:15px}th{color:#747990;font-size:10px;text-transform:uppercase;letter-spacing:.09em}th,td{text-align:left;padding:13px;border-bottom:1px solid #26293e}.student{display:flex;align-items:center;gap:10px}.av{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#715cff,#4cb8ff);display:grid;place-items:center;font-weight:900}.cg{padding:4px 7px;border-radius:999px;background:#10291e;color:#77e9aa;font-size:11px}.actions button{border:0;background:none;color:#8d91aa;cursor:pointer}.modalWrap{position:fixed;inset:0;background:#040510d0;display:none;place-items:center;z-index:30}.modalWrap.open{display:grid}.modal{width:min(520px,92vw);background:#101322;border:1px solid #34394f;border-radius:18px;padding:22px}.modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal input,.modal select{width:100%;background:#0a0c17;color:#fff;border:1px solid #31364c;border-radius:9px;padding:10px}.modal label{display:grid;gap:5px;color:#9da1b7;font-size:11px}.row{display:flex;gap:8px;margin-top:15px}.tableWrap{overflow:auto}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.modalGrid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><div class="mark">🎓</div>Student<span style="color:#9a6cff">Hub</span></div><button id="exportBtn">Export CSV ↓</button></header><main class="wrap"><div class="head"><div><small style="color:#a582ff;font-weight:900">ADMIN • ACADEMIC RECORDS</small><h1>Student Management System</h1><p>CRUD, editing, search, course filters, metrics and export.</p></div><button class="btn primary" id="addBtn">+ Add Student</button></div><section class="metrics"><div class="metric"><small>Total Students</small><b id="mTotal">0</b></div><div class="metric"><small>Average CGPA</small><b id="mAvg">0</b></div><div class="metric"><small>Top Performer</small><b id="mTop">—</b></div><div class="metric"><small>Courses</small><b id="mCourses">0</b></div></section><section class="panel"><div class="tools"><input id="search" placeholder="Search name, email or roll number..."><select id="filter"><option value="all">All courses</option><option>B.Tech CSE</option><option>BCA</option><option>MCA</option></select><button class="btn" id="sortBtn">Sort CGPA ↓</button><button class="btn" id="resetBtn">Reset</button></div><div class="tableWrap"><table><thead><tr><th>Student</th><th>Roll No.</th><th>Course</th><th>CGPA</th><th>Attendance</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div class="modalWrap" id="modal"><div class="modal"><h2 id="modalTitle">Add Student</h2><div class="modalGrid"><label>Name<input id="name"></label><label>Email<input id="email" type="email"></label><label>Roll No.<input id="roll"></label><label>Course<select id="course"><option>B.Tech CSE</option><option>BCA</option><option>MCA</option></select></label><label>CGPA<input id="cgpa" type="number" min="0" max="10" step=".1"></label><label>Attendance %<input id="attendance" type="number" min="0" max="100"></label></div><div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save Student</button></div></div></div><script>
const seed=[{id:1,name:'Aarav Mehta',email:'aarav@example.com',roll:'CSE24101',course:'B.Tech CSE',cgpa:8.7,attendance:92},{id:2,name:'Ishita Rao',email:'ishita@example.com',roll:'BCA24018',course:'BCA',cgpa:9.1,attendance:95},{id:3,name:'Kabir Singh',email:'kabir@example.com',roll:'MCA24007',course:'MCA',cgpa:8.4,attendance:88},{id:4,name:'Meera Kapoor',email:'meera@example.com',roll:'CSE24127',course:'B.Tech CSE',cgpa:9.3,attendance:96}];let data=JSON.parse(localStorage.getItem('studenthub-pro')||'null')||seed,edit=null,desc=true;function persist(){localStorage.setItem('studenthub-pro',JSON.stringify(data))}function draw(){let q=search.value.toLowerCase(),f=filter.value;let arr=data.filter(x=>(f==='all'||x.course===f)&&(`${x.name} ${x.email} ${x.roll}`).toLowerCase().includes(q)).sort((a,b)=>desc?b.cgpa-a.cgpa:a.cgpa-b.cgpa);rows.innerHTML=arr.map(x=>`<tr><td><div class="student"><div class="av">${x.name.split(' ').map(v=>v[0]).join('').slice(0,2)}</div><div><b>${x.name}</b><br><small style="color:#7e8299">${x.email}</small></div></div></td><td>${x.roll}</td><td>${x.course}</td><td><span class="cg">${x.cgpa.toFixed(1)}</span></td><td>${x.attendance}%</td><td class="actions"><button data-edit="${x.id}">Edit</button> · <button data-del="${x.id}">Delete</button></td></tr>`).join('');mTotal.textContent=data.length;mAvg.textContent=(data.reduce((a,b)=>a+b.cgpa,0)/Math.max(data.length,1)).toFixed(1);mTop.textContent=data.length?[...data].sort((a,b)=>b.cgpa-a.cgpa)[0].name.split(' ')[0]:'—';mCourses.textContent=new Set(data.map(x=>x.course)).size;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data=data.filter(x=>x.id!=b.dataset.del);persist();draw()})}function openModal(id=null){edit=id;modal.classList.add('open');modalTitle.textContent=id?'Edit Student':'Add Student';let s=data.find(x=>x.id===id);name.value=s?.name||'';email.value=s?.email||'';roll.value=s?.roll||'';course.value=s?.course||'B.Tech CSE';cgpa.value=s?.cgpa||'';attendance.value=s?.attendance||''}addBtn.onclick=()=>openModal();cancel.onclick=()=>modal.classList.remove('open');save.onclick=()=>{if(!name.value.trim()||!email.value.trim()||!roll.value.trim()||!cgpa.value)return alert('Fill required fields');let obj={name:name.value.trim(),email:email.value.trim(),roll:roll.value.trim(),course:course.value,cgpa:+cgpa.value,attendance:+attendance.value||0};if(edit)Object.assign(data.find(x=>x.id===edit),obj);else data.unshift({id:Date.now(),...obj});persist();modal.classList.remove('open');draw()};search.oninput=filter.onchange=draw;sortBtn.onclick=()=>{desc=!desc;sortBtn.textContent='Sort CGPA '+(desc?'↓':'↑');draw()};resetBtn.onclick=()=>{data=structuredClone(seed);persist();draw()};exportBtn.onclick=()=>{let csv='Name,Email,Roll,Course,CGPA,Attendance\n'+data.map(x=>[x.name,x.email,x.roll,x.course,x.cgpa,x.attendance].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='studenthub-records.csv';a.click()};draw();
</script><script>(function(){const storageKey='studenthub-pro',apiKey='studenthub';const original=localStorage.setItem.bind(localStorage);localStorage.setItem=function(k,v){original(k,v);if(k===storageKey)fetch('/api/state/'+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:JSON.parse(v)})}).catch(()=>{})};fetch('/api/state/'+apiKey).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.state&&!sessionStorage.getItem('api-hydrated-'+apiKey)){sessionStorage.setItem('api-hydrated-'+apiKey,'1');original(storageKey,JSON.stringify(d.state));location.reload()}}).catch(()=>{});})();</script></body></html>
