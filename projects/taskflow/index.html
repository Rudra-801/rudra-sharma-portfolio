<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Pro — Kanban Workspace</title><style>
:root{--bg:#071018;--panel:#0d1622;--line:#213044;--text:#f4f8ff;--muted:#8291a5;--cyan:#42d3ff;--purple:#8f67ff;--green:#4de394;--gold:#ffc65a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 560px at 90% 0,#112c4d66,transparent 70%),#060b11;color:var(--text);font:14px/1.5 Inter,system-ui}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #1c2b3e;background:#07101acc}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:19px}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;color:#071018}.topActions{display:flex;gap:8px}.btn{border:1px solid #2b3b51;background:#111b29;color:#fff;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}.btn.primary{background:#48cfff;color:#06131b;border-color:#48cfff}.wrap{width:min(1320px,94vw);margin:28px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.head h1{font-size:34px;margin:0 0 5px}.head p{color:var(--muted);margin:0}.stats{display:flex;gap:10px}.stats div{padding:11px 14px;border:1px solid #24334a;background:#0c1521;border-radius:12px;min-width:90px}.stats b{display:block;font-size:20px}.controls{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin:22px 0}.controls input,.controls select{background:#0b1420;color:#fff;border:1px solid #27374d;border-radius:11px;padding:10px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.column{background:#09121c;border:1px solid #1f2e42;border-radius:18px;min-height:520px;padding:14px}.colHead{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 14px}.colHead b{font-size:13px}.count{background:#141f2e;color:#90a1b7;border-radius:999px;padding:3px 8px;font-size:10px}.drop{min-height:430px}.task{padding:14px;border-radius:14px;border:1px solid #25364c;background:linear-gradient(145deg,#101a28,#0d1622);margin-bottom:11px;cursor:grab;box-shadow:0 10px 24px #0003}.task.dragging{opacity:.45}.task h3{margin:0 0 6px;font-size:14px}.task p{color:#8795a8;margin:0 0 11px;font-size:12px}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:4px 7px;border-radius:999px;background:#151f2d;color:#9eadbf;font-size:9px}.priority-high{color:#ff8c96}.priority-medium{color:#ffc85c}.priority-low{color:#72dda8}.taskFoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.taskFoot button{border:0;background:none;color:#7f90a5;cursor:pointer}.drop.over{outline:2px dashed #45cfff55;outline-offset:3px}.modalWrap{position:fixed;inset:0;background:#02060bcc;display:none;place-items:center;z-index:50}.modalWrap.open{display:grid}.modal{width:min(500px,92vw);background:#0c1521;border:1px solid #2a3c53;border-radius:18px;padding:22px}.modal h2{margin-top:0}.modal input,.modal textarea,.modal select{width:100%;margin:6px 0 12px;padding:10px;background:#08111b;color:#fff;border:1px solid #293b52;border-radius:9px}.row{display:flex;gap:8px}@media(max-width:850px){.board{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.stats{display:none}}
</style></head><body><header class="top"><div class="brand"><div class="mark">✓</div>TaskFlow <span style="color:#42d3ff">Pro</span></div><div class="topActions"><button class="btn" id="reset">Reset demo</button><button class="btn primary" id="newTask">+ New Task</button></div></header><main class="wrap"><div class="head"><div><small style="color:#46cef9;font-weight:900">PRODUCT ENGINEERING BOARD</small><h1>Ship work, not chaos.</h1><p>CRUD + drag-and-drop status workflow + persistent local state.</p></div><div class="stats"><div><small>Total</small><b id="total">0</b></div><div><small>Completed</small><b id="done">0</b></div></div></div><div class="controls"><input id="search" placeholder="Search tasks..."><select id="priority"><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><button class="btn" id="clearDone">Clear completed</button></div><section class="board" id="board"></section></main><div class="modalWrap" id="modal"><div class="modal"><h2 id="modalTitle">Create task</h2><input id="title" placeholder="Task title"><textarea id="desc" rows="3" placeholder="Description"></textarea><select id="p"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="due" type="date"><div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save task</button></div></div></div><script>
const seed=[{id:1,title:'Polish portfolio project cards',desc:'Replace embedded iframes with clean screenshots and real demo links.',priority:'High',due:'2026-09-03',status:'In Progress'},{id:2,title:'Verify NEXZO V170',desc:'Check planner, dashboard and Study Assistant before viva.',priority:'High',due:'2026-09-03',status:'Pending'},{id:3,title:'Document REST endpoints',desc:'Add route/controller/model explanation to README.',priority:'Medium',due:'2026-09-04',status:'Completed'},{id:4,title:'Test responsive layout',desc:'Validate mobile navigation and contact form states.',priority:'Low',due:'2026-09-04',status:'Pending'}];let tasks=JSON.parse(localStorage.getItem('taskflow-pro4')||'null')||seed,edit=null;const cols=['Pending','In Progress','Completed'];function persist(){localStorage.setItem('taskflow-pro4',JSON.stringify(tasks))}function render(){let q=search.value.toLowerCase(),pr=priority.value;board.innerHTML=cols.map(c=>{let arr=tasks.filter(t=>t.status===c&&(pr==='all'||t.priority===pr)&&(`${t.title} ${t.desc}`).toLowerCase().includes(q));return `<article class="column"><div class="colHead"><b>${c}</b><span class="count">${arr.length}</span></div><div class="drop" data-status="${c}">${arr.map(t=>`<div class="task" draggable="true" data-id="${t.id}"><h3>${t.title}</h3><p>${t.desc}</p><div class="meta"><span class="tag priority-${t.priority.toLowerCase()}">${t.priority}</span><span class="tag">Due ${t.due||'—'}</span></div><div class="taskFoot"><small style="color:#68798e">#${String(t.id).slice(-4)}</small><div><button data-edit="${t.id}">Edit</button><button data-del="${t.id}">Delete</button></div></div></div>`).join('')}</div></article>`}).join('');total.textContent=tasks.length;done.textContent=tasks.filter(t=>t.status==='Completed').length;bindDnD();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(t=>t.id!=b.dataset.del);persist();render()})}function bindDnD(){document.querySelectorAll('.task').forEach(t=>{t.ondragstart=()=>{t.classList.add('dragging');window.dragId=+t.dataset.id};t.ondragend=()=>t.classList.remove('dragging')});document.querySelectorAll('.drop').forEach(d=>{d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');let t=tasks.find(x=>x.id===window.dragId);if(t){t.status=d.dataset.status;persist();render()}}})}function openEdit(id=null){edit=id;modal.classList.add('open');let t=tasks.find(x=>x.id===id);modalTitle.textContent=id?'Edit task':'Create task';title.value=t?.title||'';desc.value=t?.desc||'';p.value=t?.priority||'Medium';due.value=t?.due||''}newTask.onclick=()=>openEdit();cancel.onclick=()=>modal.classList.remove('open');save.onclick=()=>{if(!title.value.trim())return alert('Enter a task title');let data={title:title.value.trim(),desc:desc.value.trim(),priority:p.value,due:due.value};if(edit)Object.assign(tasks.find(x=>x.id===edit),data);else tasks.unshift({id:Date.now(),status:'Pending',...data});persist();modal.classList.remove('open');render()};search.oninput=priority.onchange=render;clearDone.onclick=()=>{tasks=tasks.filter(t=>t.status!=='Completed');persist();render()};reset.onclick=()=>{tasks=structuredClone(seed);persist();render()};render();
</script><script>(function(){const storageKey='taskflow-pro',apiKey='taskflow';const original=localStorage.setItem.bind(localStorage);localStorage.setItem=function(k,v){original(k,v);if(k===storageKey)fetch('/api/state/'+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:JSON.parse(v)})}).catch(()=>{})};fetch('/api/state/'+apiKey).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.state&&!sessionStorage.getItem('api-hydrated-'+apiKey)){sessionStorage.setItem('api-hydrated-'+apiKey,'1');original(storageKey,JSON.stringify(d.state));location.reload()}}).catch(()=>{});})();</script></body></html>
