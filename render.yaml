services:
  - type: web
    name: rudra-sharma-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONTACT_STORE
        value: mongodb
      - key: MONGODB_URI
        sync: false
